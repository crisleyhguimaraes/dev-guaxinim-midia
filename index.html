<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev guaxinim · links</title>
<style>
  :root { color-scheme: dark; --fundo: #0F172A; --texto: #F8FAFC; --apoio: #CBD5E1;
          --discreto: #94A3B8; --acento: #FBBF24; --painel: #1E293B; --borda: #334155; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font: 17px/1.45 -apple-system, "Inter", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 56px; }
  header { margin-bottom: 28px; }
  .bar { width: 64px; height: 6px; border-radius: 3px; background: var(--acento); margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--apoio); }
  header .dica { margin-top: 16px; color: var(--discreto); font-size: 15px; }
  .item { display: flex; gap: 16px; align-items: center; padding: 16px; margin-bottom: 12px;
          background: var(--painel); border: 1px solid var(--borda); border-radius: 16px;
          color: inherit; text-decoration: none; }
  .item:hover { border-color: var(--acento); }
  .item:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  .n { flex: none; width: 52px; text-align: center; font-size: 30px; font-weight: 800;
       color: var(--acento); font-variant-numeric: tabular-nums; }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .txt strong { font-weight: 650; }
  .txt small { color: var(--discreto); font-size: 14px; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; }
  .vazio { color: var(--discreto); }
</style>
<main>
  <header>
    <div class="bar"></div>
    <h1>🦝 dev guaxinim</h1>
    <p>@devguaxinim · links dos posts</p>
    <p class="dica">O número é o mesmo da legenda: "link na bio, item 3" é o 3 aqui.</p>
  </header>
  <p class="vazio">Os links aparecem aqui conforme os posts saem.</p>
</main>
</html>
